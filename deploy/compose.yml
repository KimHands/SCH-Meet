# sch-meet — oci-server(ARM64, Ubuntu 24.04) ~/stacks/sch-meet/deploy 용
# 사용: cd deploy && docker compose up -d --build   (절차: deploy/README.md)
# 공개는 edge 스택의 cloudflared 터널로만. 호스트 포트 publish 없음
#   sch-meet.kimhands.com → http://sch-meet-web:8080
#  - deploy/.env : 비밀값 — 서버에서만 만든다, 커밋 금지
name: sch-meet

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 정적 파일 + /api/ 프록시. 터널이 닿는 유일한 서비스
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID 필요}
    image: sch-meet-web:latest
    restart: unless-stopped
    # api가 unhealthy여도 정적 화면은 떠야 하므로 service_healthy를 쓰지 않는다
    depends_on:
      - api
    networks:
      backend:
      edge:
        aliases: [sch-meet-web] # 다른 앱과 이름이 겹치지 않게 터널은 이 이름으로 부른다
    logging: *logging

  # Django API. 마이그레이션은 시작 시 돌리지 않는다(deploy/README.md)
  api:
    build:
      context: ../server
    image: sch-meet-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://schmeet:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요 (openssl rand -hex 24)}@db:5432/schmeet
      # db는 내부 네트워크에만 있고 postgres:16-alpine 기본 구성은 SSL을 쓰지 않는다
      DATABASE_SSL_REQUIRE: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY 필요}
      DJANGO_DEBUG: "False"
      DJANGO_BEHIND_HTTPS_PROXY: "True"
      DJANGO_ALLOWED_HOSTS: ${PUBLIC_HOST:-sch-meet.kimhands.com}
      FRONTEND_BASE_URL: https://${PUBLIC_HOST:-sch-meet.kimhands.com}
      # 터널 뒤: X-Forwarded-For 는 클라이언트가 위조할 수 있다 → Cloudflare가 덮어쓰는 헤더로 레이트 리밋
      CLIENT_IP_HEADER: CF-Connecting-IP
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID 필요}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:?OCR_SPACE_API_KEY 필요}
    depends_on:
      db:
        condition: service_healthy
    networks:
      backend:
        aliases: [sch-meet-api] # web은 edge에도 붙어 있어 "api"가 다른 앱으로 해석될 수 있다
    logging: *logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schmeet
      POSTGRES_DB: schmeet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요 (openssl rand -hex 24)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schmeet -d schmeet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *logging

  # 일일 pg_dump → Cloudflare R2(서버 밖). 기동 직후 1회 + 매일 04:00 KST, 30일 보관
  backup:
    build:
      context: ..
      dockerfile: deploy/backup/Dockerfile
    image: sch-meet-backup:latest
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: schmeet
      PGDATABASE: schmeet
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요 (openssl rand -hex 24)}
      TZ: Asia/Seoul
      BACKUP_CRON: ${BACKUP_CRON:-0 4 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_PREFIX: sch-meet/postgres
      R2_BUCKET: ${BACKUP_R2_BUCKET:?BACKUP_R2_BUCKET 필요}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT:?BACKUP_R2_ENDPOINT 필요}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:?BACKUP_R2_ACCESS_KEY_ID 필요}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:?BACKUP_R2_SECRET_ACCESS_KEY 필요}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    logging: *logging

volumes:
  pgdata:

networks:
  backend:
  # edge 스택(cloudflared 하나)이 만든 공유 네트워크. 없으면: docker network create edge
  edge:
    external: true
